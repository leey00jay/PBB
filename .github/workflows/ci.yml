name: PBB ROS 2 checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ros2:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install build and CPU test dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pytest python3-numpy ros-humble-rosidl-default-generators ros-humble-rosbag2-storage-default-plugins
      - name: Build all ROS packages
        run: ./build_ros2.sh
      - name: Check algorithms, DDS, and current launch lifecycle
        run: ./test_ros2.sh
      - name: Compile maintained Python sources
        run: python3 -m compileall -q src tests start_carla.py
