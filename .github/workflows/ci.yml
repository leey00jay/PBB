name: CARLA practice checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane-following:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install unit test dependency
        run: python -m pip install numpy==1.26.4
      - name: Check perception, decision, control, and runtime behavior
        working-directory: aad
        run: python -m unittest discover -s code/tests -t . -p 'test_*.py' -v
      - name: Compile Python sources
        run: python -m compileall -q start_carla.py connect_carla.py spawn_car.py aad/code
